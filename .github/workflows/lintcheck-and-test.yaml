name: Lint Check & Test
on: [pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check & Test
        run: npx svelte-kit sync && npm run ci
